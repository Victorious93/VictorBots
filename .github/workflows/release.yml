name: Release (production-signed)

# Manual only. Needs repository secrets: VB_RELEASE_KEYSTORE_B64 (base64 of the .jks),
# VB_RELEASE_KEY_ALIAS, VB_RELEASE_STORE_PASS, VB_RELEASE_KEY_PASS.
# Refuses to publish anything signed with the public debug key. Creates a DRAFT release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.1)
        required: true

permissions:
  contents: write

env:
  VB_DEBUG_SIGNER_SHA256: 23cefc35fa9b8ce1f5d3cce7b189aa340ff65051834cc8996eada08d6a0f5b82

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: '' }
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Tests must pass
        run: bash scripts/test-jvm.sh
      - name: Build and sign with the production key
        env:
          KS_B64: ${{ secrets.VB_RELEASE_KEYSTORE_B64 }}
          VB_RELEASE_KEY_ALIAS: ${{ secrets.VB_RELEASE_KEY_ALIAS }}
          VB_RELEASE_STORE_PASS: ${{ secrets.VB_RELEASE_STORE_PASS }}
          VB_RELEASE_KEY_PASS: ${{ secrets.VB_RELEASE_KEY_PASS }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::VB_RELEASE_KEYSTORE_B64 secret is not set"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VB_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" bash scripts/build-sdk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Refuse the debug signer
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/sdk/VictorBots-0.2.0-release.apk \
            | grep -qi "certificate SHA-256 digest: $VB_DEBUG_SIGNER_SHA256" \
            && { echo "::error::Release is signed with the public debug key"; exit 1; } || true
      - name: Draft release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "${{ inputs.tag }}" app/build/sdk/VictorBots-0.2.0-release.apk \
            --draft --title "VictorBots ${{ inputs.tag }}" --generate-notes
