plugins { id 'com.android.application' }
android {
    namespace 'com.victorious.bots'
    compileSdk 35
    defaultConfig { applicationId 'com.victorious.bots'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
    signingConfigs { debug { storeFile rootProject.file('signing/victorbots-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
